services:
  - type: web
    name: liamodiaga-cv
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    renderSubdomainPolicy: enabled
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: Mckeever
      - key: ADMIN_PASSWORD
        sync: false
